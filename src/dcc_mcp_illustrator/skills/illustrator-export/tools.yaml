tools:
  - name: save_document
    description: Save the active document in place or save it to an explicit absolute path.
    input_schema:
      type: object
      properties:
        path: {type: string, description: Optional absolute destination path.}
        format: {type: string, default: ai}
        options: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    source_file: scripts/save_document.py
  - name: export_document
    description: Export the active document to an explicit absolute path and format.
    input_schema:
      type: object
      required: [format, path]
      properties:
        format: {type: string, description: Illustrator format such as ai, pdf, eps, png24, jpeg, or svg.}
        path: {type: string, description: Absolute destination path.}
        options: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: any
    timeout_hint_secs: 120
    source_file: scripts/export_document.py
