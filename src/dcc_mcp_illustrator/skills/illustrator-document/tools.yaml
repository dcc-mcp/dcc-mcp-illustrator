tools:
  - name: create_document
    description: Create one RGB or CMYK Illustrator document with explicit point dimensions through the structured official DOM.
    input_schema:
      type: object
      properties:
        width: {type: number, exclusiveMinimum: 0, default: 640, description: Document width in points.}
        height: {type: number, exclusiveMinimum: 0, default: 360, description: Document height in points.}
        color_space: {type: string, enum: [rgb, cmyk], default: rgb}
        timeout_secs: {type: number, minimum: 1, maximum: 300, default: 30}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    source_file: scripts/create_document.py
  - name: inspect_document
    description: Inspect active Illustrator document metadata, collection counts, and active artboard.
    input_schema: {type: object, properties: {}}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    source_file: scripts/inspect_document.py
  - name: list_artboards
    description: List all artboards and the active artboard index.
    input_schema: {type: object, properties: {}}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    source_file: scripts/list_artboards.py
  - name: list_layers
    description: List top-level layers or child layers under an exact parent name.
    input_schema:
      type: object
      properties: {parent: {type: string, description: Optional exact parent layer name.}}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    source_file: scripts/list_layers.py
  - name: list_items
    description: List or find Illustrator artwork, text, stories, or swatches by typed collection.
    input_schema:
      type: object
      properties:
        kind: {type: string, enum: [page, path, compound, placed, raster, text, story, swatch], default: page}
        selected: {type: boolean, default: false}
        layer: {type: string, description: Optional exact layer name filter.}
        name: {type: string, description: Optional exact item name.}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    source_file: scripts/list_items.py
